<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="weather">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
    <img id="icon" class="icon" src="" alt="">
    <div class="temp" id="temp"></div>
    <div class="desc" id="description"></div>
    <div class="details" id="feels_like"></div>
    <div class="details" id="humidity"></div>
    <div class="details" id="pressure"></div>
    <div class="details" id="wind"></div>
    <button onclick="getWeather()">update</button>
</div>
<script src="main.js"></script>
</body>
</html>
